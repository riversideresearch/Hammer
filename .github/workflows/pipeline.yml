name: Pipeline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CFLAGS: "-std=c99 -pedantic -Wall -Wstrict-prototypes -Wwrite-strings -Wpointer-arith -Wcast-align -Werror"

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        check:
          - clang-format
          - ruff
          - scons-test
          - build-deb

    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        if: matrix.check == 'clang-format'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        if: matrix.check == 'clang-format'
        run: |
          find src examples -name '*.c' -o -name '*.h' | xargs clang-format --dry-run --Werror

      - name: Install ruff
        if: matrix.check == 'ruff'
        run: pip install ruff==0.14.6

      - name: Lint Python and SCons files
        if: matrix.check == 'ruff'
        run: |
          ruff check $(find . -path ./build -prune -o \( -name "*.py" -o -name "SConstruct" -o -name "SConscript" \) -print)

      - name: Install test dependencies
        if: matrix.check == 'scons-test'
        run: |
          sudo apt-get update
          sudo apt-get install -y scons gcc libglib2.0-dev pkg-config swig default-jdk libgtest-dev python3-setuptools

      - name: Run tests
        if: matrix.check == 'scons-test'
        env:
          CFLAGS: "-std=c99 -pedantic -Wall -Wstrict-prototypes -Wwrite-strings -Wpointer-arith -Wcast-align -Werror -fsanitize=undefined"
          LDFLAGS: "-fsanitize=undefined"
        run: scons test

      - name: Run binding tests
        if: matrix.check == 'scons-test'
        env:
          CFLAGS: "-std=c99 -pedantic -Wall -Wstrict-prototypes -Wwrite-strings -Wpointer-arith -Wcast-align -Werror -fsanitize=undefined"
          LDFLAGS: "-fsanitize=undefined"
        run: scons bindings=all test

      - name: Install package dependencies
        if: matrix.check == 'build-deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts scons libglib2.0-dev pkg-config

      - name: Build .deb package
        if: matrix.check == 'build-deb'
        run: dpkg-buildpackage -us -uc -b

      - name: Find and rename generated .deb
        if: matrix.check == 'build-deb'
        id: deb
        run: |
          DEB_FILE=$(ls ../libhammer_*.deb)
          VERSION=$(cat VERSION)
          NEW_NAME="libhammer_${VERSION}_amd64.deb"
          mv $DEB_FILE $NEW_NAME
          echo "deb_file=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        if: matrix.check == 'build-deb'
        uses: actions/upload-artifact@v4
        with:
          name: libhammer-deb
          path: ${{ steps.deb.outputs.deb_file }}

  macos-build:
    name: macos-build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        run: brew install scons glib pkg-config

      - name: Run native macOS build and tests
        run: scons test

      - name: Validate installed native macOS library
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/hammer-prefix"
          STAGING_ROOT="$RUNNER_TEMP/hammer-stage"
          CONSUMER_DIR="$(mktemp -d "$RUNNER_TEMP/hammer-consumer.XXXXXX")"

          scons install prefix="$PREFIX"
          test "$(otool -D "$PREFIX/lib/libhammer.dylib" | tail -n +2)" = "$PREFIX/lib/libhammer.dylib"

          cp tests/installed_consumer_smoke.c "$CONSUMER_DIR/"
          (
            cd "$CONSUMER_DIR"
            export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
            cc installed_consumer_smoke.c -o installed_consumer_smoke \
              $(pkg-config --cflags --libs libhammer)
            env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH ./installed_consumer_smoke
          )

          scons install prefix="$PREFIX" DESTDIR="$STAGING_ROOT"
          STAGED_DYLIB="$STAGING_ROOT${PREFIX}/lib/libhammer.dylib"
          test "$(otool -D "$STAGED_DYLIB" | tail -n +2)" = "$PREFIX/lib/libhammer.dylib"
